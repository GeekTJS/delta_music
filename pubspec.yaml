name: delta_music
description: 三角洲音乐 - 一款精美的音乐播放器
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  just_audio: ^0.9.36
  audio_service: ^0.18.12

  dio: ^5.4.0

  cached_network_image: ^3.3.1

  go_router: ^13.0.1

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  flutter_local_notifications: ^16.3.2

  permission_handler: ^11.1.0

  path_provider: ^2.1.2

  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/